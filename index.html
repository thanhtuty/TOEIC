<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sổ học · TOEIC 700</title>
<style>
:root{--ink:#173e35;--dark:#194b3d;--leaf:#def394;--mint:#e6eddf;--page:#f7f6ef;--line:#d2dace}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}header{background:var(--dark);color:white}header>div,main,footer{max-width:1120px;margin:auto;padding:20px 32px}header>div,nav,.actions,.tabs,.between{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between,header>div{justify-content:space-between}.brand{font:700 32px Georgia,serif;color:white;text-decoration:none}.brand small{font:700 12px system-ui;color:var(--leaf);letter-spacing:.12em}nav a{color:#fff;padding:8px;text-decoration:none}nav a[aria-current]{border-bottom:2px solid var(--leaf)}main{min-height:75vh;padding-top:38px}h1,h2,h3,p{margin:0 0 12px}h1{font:600 clamp(34px,5vw,54px)/1.15 Georgia,serif;letter-spacing:-.025em}h2{font-size:24px}.meta,footer{color:#516b5d;font-size:14px}.hero,.card,.selection{border-radius:18px;padding:24px;margin:18px 0;background:white;border:1px solid var(--line)}.hero{background:var(--dark);color:white}.hero small{color:var(--leaf)}.hero h2{font-size:30px}.selection{background:var(--mint)}button,.btn,select,input{font:inherit;border-radius:9px;padding:10px 16px}button,.btn{cursor:pointer;border:0;background:var(--dark);color:white;text-decoration:none;display:inline-block;font-weight:600}button:hover,.btn:hover{filter:brightness(1.13)}.soft,.tabs a{background:var(--mint);color:var(--ink)}.tabs a.active,.day.sel{background:var(--dark);color:white}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.grid b{font-size:14px;text-align:center}.day{min-height:66px;background:white;color:var(--ink);border:1px solid var(--line);text-align:left}.day small{display:block;font-weight:400}.lessonrow{display:grid;grid-template-columns:68px 1fr;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}.num{font:italic 28px Georgia;color:#57805b}.words{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.words .card{margin:0}.actions{margin-top:16px}.lead{font:500 28px Georgia,serif}.tabs{margin:20px 0}details{padding:12px 0}summary{cursor:pointer;font-weight:600}label{display:inline-grid;gap:5px}input,select{border:1px solid #90a396;background:white;color:var(--ink)}input[type=checkbox]{accent-color:var(--dark)}:focus-visible{outline:3px solid #d8912e;outline-offset:2px}footer{border-top:1px solid var(--line)}@media(max-width:650px){header>div,main,footer{padding:16px}.grid{gap:3px}.day{padding:5px;font-size:13px}.day small{font-size:10px}nav{gap:2px}nav a{font-size:14px;padding:5px}.hero,.card,.selection{padding:16px}}
</style><header><div><a class="brand" href="#today">Sổ học <small>TOEIC 700</small></a><nav id="nav"></nav></div></header><main id="app"></main><footer>24.11 — 23.12.2026 · Lộ trình 30 ngày · Tiến độ lưu trên trình duyệt này.</footer><script>
const lessons=[["Lịch họp","is / are","attend a meeting•dự họp;confirm attendance•xác nhận tham dự","The meeting is in Room 2.","The reports are on the desk.","20 câu nghe và 20 câu đọc"],["Trong văn phòng","Đại từ và to be","a filing cabinet•tủ hồ sơ;beside the desk•cạnh bàn","She is at her desk.","They are in the office.","10 câu Part 1"],["Công việc hằng ngày","Hiện tại đơn","check emails•kiểm tra email;print a report•in báo cáo","She checks her emails.","They check their emails.","15 câu Part 5"],["Hành động trong ảnh","Hiện tại tiếp diễn","carry a box•mang một chiếc hộp;stack chairs•xếp ghế","He is carrying a box.","They are stacking chairs.","10 câu Part 1"],["Thiết bị văn phòng","Mạo từ","an envelope•một phong bì;a printer•một máy in","I need an envelope.","The printer is near the door.","15 câu Part 5"],["Giờ và địa điểm","in / on / at","at noon•lúc trưa;on Friday•vào thứ Sáu","We meet at noon.","The office opens on Monday.","15 câu Part 2"],["Ôn tuần 1","Ôn động từ","start work•bắt đầu làm việc;at the office•ở văn phòng","She starts work at nine.","They are at the office.","15 nghe + 15 đọc"],["Đi công tác","Quá khứ đơn","book a flight•đặt vé máy bay;arrive late•đến muộn","We booked a flight.","She arrived late.","15 câu Part 2"],["Lịch hẹn","Tương lai","make an appointment•đặt lịch hẹn;call back•gọi lại","I will call back.","We are going to meet tomorrow.","15 câu Part 5"],["Các phòng ban","Hòa hợp chủ ngữ","the sales team•đội bán hàng;staff members•các nhân viên","The manager works here.","Staff members work upstairs.","10 câu Part 1 + 10 câu Part 5"],["Sản phẩm","Tính từ và trạng từ","a reliable product•sản phẩm đáng tin cậy;work efficiently•làm việc hiệu quả","This product is reliable.","The machine works efficiently.","20 câu Part 5"],["Đặt hàng","Lượng từ","office supplies•vật tư văn phòng;some equipment•một số thiết bị","We need some equipment.","Many boxes arrived.","15 câu Part 5 + 1 đoạn Part 6"],["Email thông báo","Liên từ","due to rain•do trời mưa;cancel a trip•hủy chuyến đi","We stayed because it rained.","It rained, so we stayed.","2 đoạn Part 6"],["Ôn tuần 2","Ôn từ loại","a quick reply•lời đáp nhanh;reply promptly•phản hồi kịp thời","Thank you for the quick reply.","Please reply promptly.","20 nghe + 20 đọc"],["Hỏi và đáp","Từ để hỏi","which floor•tầng nào;how often•bao lâu một lần","Where is the meeting?","When does it start?","20 câu Part 2"],["Hội thoại công sở","Câu hỏi với do","request help•yêu cầu trợ giúp;front desk•quầy lễ tân","Where do you work?","I work at the front desk.","3 hội thoại Part 3"],["Hẹn giao hàng","Thời gian và trình tự","next week•tuần sau;after lunch•sau bữa trưa","The order arrives after lunch.","We will call you next week.","3 hội thoại Part 3"],["Thông báo công cộng","Câu mệnh lệnh","remain seated•tiếp tục ngồi;main entrance•lối vào chính","Please remain seated.","Use the main entrance.","3 bài Part 4"],["Lời nhắn thoại","Động từ nguyên mẫu chỉ mục đích","leave a message•để lại lời nhắn;confirm a booking•xác nhận đặt chỗ","I called to confirm a booking.","Please leave a message.","3 bài Part 4"],["Ôn tiếng Anh công việc","Dạng động từ","plan to attend•dự định tham dự;finish writing•viết xong","We plan to attend.","She finished writing the report.","25 câu Part 5"],["Ôn tuần 3","Ôn từ hỏi","departure time•giờ khởi hành;ticket counter•quầy vé","When does the train leave?","Where is the ticket counter?","25 nghe + 25 đọc"],["Hoàn thành văn bản","Từ nối","as a result•do đó;in addition•ngoài ra","It snowed. As a result, we closed early.","In addition, parking is free.","3 đoạn Part 6"],["Đọc email","Câu yêu cầu","send a copy•gửi một bản;reply by Friday•phản hồi chậm nhất thứ Sáu","Could you send a copy?","Please reply by Friday.","3 email Part 7"],["Đọc lịch trình","Giới từ thời gian","opening hours•giờ mở cửa;until noon•đến trưa","The shop is open until noon.","It opens at nine.","15 câu Part 7"],["Nối hai văn bản","Đại từ thay thế","order number•mã đơn hàng;delivery date•ngày giao hàng","The package is here. It arrived today.","The items are ready. They are on the shelf.","2 bộ bài đọc đôi"],["Ôn câu ngắn","Ôn hòa hợp chủ ngữ","each employee•mỗi nhân viên;all employees•tất cả nhân viên","Each employee has a badge.","All employees have badges.","30 câu Part 5"],["Ôn nghe tổng hợp","Câu hỏi lựa chọn","morning shift•ca sáng;evening shift•ca tối","Do you work mornings or evenings?","I work the evening shift.","30 câu nghe"],["Kiểm tra tổng hợp","Ôn thì","last month•tháng trước;every month•mỗi tháng","Sales increased last month.","We meet every month.","30 nghe + 30 đọc"],["Chữa lỗi cá nhân","Ôn hai nhóm lỗi","review a mistake•xem lại lỗi;try again•thử lại","She reviews her notes.","They review their notes.","20 câu thuộc hai dạng yếu"],["Đo tiến bộ","Ôn toàn tháng","compare results•so sánh kết quả;set a goal•đặt mục tiêu","I compared my results.","My next goal is to read faster.","20 câu nghe + 20 câu đọc"]];
const rules=["Dùng is với một người hoặc vật, are với chủ ngữ số nhiều.","She đi với is. They đi với are.","Với he, she, it, động từ thường thêm -s hoặc -es.","Dùng am/is/are + động từ đuôi -ing cho hành động đang diễn ra.","Dùng an trước âm nguyên âm, a trước âm phụ âm. The chỉ vật đã xác định.","Dùng at với giờ, on với ngày, in với tháng hoặc năm.","Tìm chủ ngữ trước khi chia động từ.","Động từ có quy tắc thường thêm -ed ở quá khứ đơn.","Will + động từ nguyên thể. Be going to diễn tả dự định.","Động từ hòa hợp với chủ ngữ chính.","Tính từ bổ nghĩa cho danh từ. Trạng từ có thể bổ nghĩa cho động từ.","Many đi với danh từ đếm được số nhiều. Equipment là danh từ không đếm được.","Because nêu lý do. So giới thiệu kết quả.","Quick mô tả danh từ reply. Promptly bổ nghĩa cho động từ reply.","Where hỏi nơi chốn. When hỏi thời gian.","Dùng do hoặc does trước chủ ngữ trong câu hỏi hiện tại đơn với động từ thường.","After chỉ việc xảy ra sau một mốc thời gian.","Câu mệnh lệnh bắt đầu bằng động từ nguyên thể.","To + động từ nguyên thể có thể chỉ mục đích.","Plan đi với to + động từ. Finish đi với động từ đuôi -ing.","Đọc từ hỏi để xác định loại thông tin cần nghe.","As a result báo hiệu kết quả. In addition bổ sung thông tin.","Could you + động từ nguyên thể là lời yêu cầu lịch sự.","Until chỉ điểm kết thúc. At đứng trước giờ cụ thể.","It thay danh từ số ít. They thay danh từ số nhiều.","Each employee là số ít. All employees là số nhiều.","Câu hỏi có or đưa ra lựa chọn.","Last month gợi mốc quá khứ. Every month diễn tả sự lặp lại.","Kiểm tra chủ ngữ và mốc thời gian của câu sai.","Đọc lại ngữ cảnh thời gian trước khi chọn thì."];
const tabs=['Bài học','Từ mới','Ngữ pháp'],routes=['lesson','words','grammar'];
const start=Date.UTC(2026,10,24), zone='Asia/Ho_Chi_Minh', dayMs=86400000;
const stamp=n=>new Date(start+(n-1)*dayMs).toLocaleDateString('vi-VN',{timeZone:'UTC',day:'2-digit',month:'2-digit'});
function today(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const val=k=>Number(parts.find(x=>x.type===k).value);return Math.max(1,Math.min(30,1+(Date.UTC(val('year'),val('month')-1,val('day'))-start)/dayMs))}
const key='toeic-study-v1';let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch{}
function save(k,v){state[k]=v;try{localStorage.setItem(key,JSON.stringify(state))}catch{alert('Trình duyệt chưa cho phép lưu tiến độ.')}render()}
const btn=(label,path,extra='')=>'<a class="btn '+extra+'" href="#'+path+'">'+label+'</a>';
const toolsFor=n=>routes.map((v,i)=>btn(tabs[i],v+'/'+n,'soft')).join(' ');
function toggle(k,label){return '<label><span><input type="checkbox" data-save="'+k+'" '+(state[k]?'checked':'')+'> '+label+'</span></label>'}
const words=n=>lessons[n-1][2].split(';').map(s=>s.split('•'));
function calendar(n){let cells=['T2','T3','T4','T5','T6','T7','CN'].map(s=>'<b>'+s+'</b>').join('')+'<span></span>';lessons.forEach((l,i)=>{let k=i+1;cells+='<button class="day '+(k===n?'sel':'')+'" data-day="'+k+'" aria-label="Ngày '+k+', '+l[0]+'">'+stamp(k)+'<small>Buổi '+k+'</small></button>'});return '<p class="meta">24 tháng 11 — 23 tháng 12, 2026</p><h1>Lịch học 30 ngày</h1><div class="card grid">'+cells+'</div><section class="selection"><small>Đang chọn · '+stamp(n)+'</small><h2>Ngày '+n+' · '+lessons[n-1][0]+'</h2><div class="actions">'+toolsFor(n)+'</div></section>'}
function lesson(n,part){let [topic,g,,a,b,task]=lessons[n-1];let head='<a href="#calendar/'+n+'">← Lịch học</a><p class="meta">Buổi '+n+' / 30 · '+stamp(n)+'</p><h1>'+topic+'</h1><div class="tabs">'+routes.map((r,i)=>btn(tabs[i],r+'/'+n,r===part?'active':'')).join('')+'</div>';
if(part==='words')return head+'<h2>Từ mới ngày '+n+'</h2><div class="words">'+words(n).map(([en,vi],i)=>'<article class="card"><h2>'+en+'</h2><p>'+vi+'</p>'+toggle('v'+n+'-'+i,'Đã học từ này')+'</article>').join('')+'</div>';
if(part==='grammar')return head+'<section class="selection"><h2>'+g+'</h2><p>'+rules[n-1]+'</p></section><article class="card"><h3>Hai câu mẫu</h3><p>'+a+'</p><p>'+b+'</p><details><summary>Tự luyện</summary>Viết một câu về lịch học của bạn theo mẫu đầu tiên rồi thay chủ ngữ hoặc thời gian.</details>'+toggle('g'+n,'Đã học chủ điểm này')+'</article>';
let blocks=n===1?[['Đo đầu vào',task],['Từ mới và ngữ pháp',g],['Chữa bài','Nghe lại 5 câu khó và tìm bằng chứng cho 5 câu đọc.']]:[['Học từ và ngữ pháp',g],['Luyện kỹ năng',a+' '+b],['Luyện trên website',task]];
return head+'<div class="hero"><small>KẾ HOẠCH 3 GIỜ</small><h2>'+task+'</h2></div><article class="card">'+blocks.map(([title,detail],i)=>'<div class="lessonrow"><span class="num">0'+(i+1)+'</span><div><h3>'+title+'</h3><p>'+detail+'</p>'+toggle('hour'+n+'-'+i,'Hoàn thành 60 phút')+'</div></div>').join('')+'</article><section class="card"><h3>Kết quả luyện tập</h3><form id="score"><label>Số câu đúng<input type="number" name="right" min="0" max="200" required value="'+(Number.isInteger(state['r'+n])?state['r'+n]:'')+'"></label> <label>Tổng số câu<input type="number" name="total" min="1" max="200" required value="'+(Number.isInteger(state['t'+n])?state['t'+n]:'')+'"></label> <button>Lưu kết quả</button></form>'+(state['t'+n]?'<p>Đã lưu · '+state['r'+n]+' / '+state['t'+n]+'</p>':'')+'</section>'}
let filter=0;
function review(grammar){let active=lessons.map((_,i)=>i+1).filter(n=>grammar?state['g'+n]:words(n).some((_,i)=>state['v'+n+'-'+i]));let title=grammar?'Ôn ngữ pháp':'Ôn từ vựng';let nItems=grammar?active.length:active.reduce((s,n)=>s+words(n).filter((_,i)=>state['v'+n+'-'+i]).length,0);
let head='<p class="meta">Ôn luyện tích lũy</p><h1>'+title+'</h1><section class="hero"><h2>'+nItems+(grammar?' chủ điểm':' cụm từ')+' đã học</h2><span>Nội dung được thêm khi bạn đánh dấu đã học trong từng buổi.</span></section>';
if(!active.length)return head+'<article class="card"><h3>Chưa có nội dung đã học</h3>'+btn('Mở bài hôm nay',(grammar?'grammar/':'words/')+today())+'</article>';
if(!active.includes(filter))filter=0;
return head+'<label>Chọn buổi<select id="filter"><option value="0">Tất cả các buổi</option>'+active.map(n=>'<option value="'+n+'" '+(filter===n?'selected':'')+'>Buổi '+n+'</option>').join('')+'</select></label>'+active.filter(n=>!filter||n===filter).map(n=>'<article class="card"><small>Buổi '+n+' · '+stamp(n)+'</small><h2>'+lessons[n-1][0]+'</h2>'+(grammar?'<details><summary>'+lessons[n-1][1]+' · Bạn nhớ quy tắc nào?</summary><p>'+rules[n-1]+'</p>'+lessons[n-1][3]+'</details>':words(n).map(([en,vi],i)=>state['v'+n+'-'+i]?'<details><summary>'+en+'</summary>'+vi+'</details>':'').join(''))+btn('Xem bài gốc',(grammar?'grammar/':'words/')+n,'soft')+'</article>').join('')}
function render(){let [page,raw]=location.hash.slice(1).split('/');page=page||'today';let n=Math.min(30,Math.max(1,parseInt(raw,10)||today()));let category=page==='calendar'?'calendar':page.startsWith('review-')?page:'today';nav.innerHTML=[['today','Hôm nay'],['calendar','Lịch học'],['review-words','Ôn từ vựng'],['review-grammar','Ôn ngữ pháp']].map(([r,s])=>'<a href="#'+r+'" '+(category===r?'aria-current="page"':'')+'>'+s+'</a>').join('');
app.innerHTML=page==='calendar'?calendar(n):page==='review-words'||page==='review-grammar'?review(page==='review-grammar'):lesson(page==='today'?today():n,routes.includes(page)?page:'lesson');
app.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>location.hash='calendar/'+b.dataset.day);app.querySelectorAll('[data-save]').forEach(b=>b.onchange=()=>save(b.dataset.save,b.checked));let f=document.querySelector('#filter');if(f)f.onchange=()=>{filter=Number(f.value);render()};let score=document.querySelector('#score');if(score)score.onsubmit=e=>{e.preventDefault();let k=page==='today'?today():n,r=Number(score.right.value),t=Number(score.total.value);if(r>t)return alert('Số câu đúng phải nhỏ hơn hoặc bằng tổng số câu.');state['r'+k]=r;save('t'+k,t)}}
window.addEventListener('hashchange',()=>{filter=0;render();if(!location.hash.startsWith('#calendar/'))scrollTo(0,0)});render();
</script></html>
